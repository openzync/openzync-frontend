# ──────────────────────────────────────────────────────────────────────────────
# OpenZync — Frontend Deployment
# ──────────────────────────────────────────────────────────────────────────────
# Attach-only on the shared openzync_network (creation owned by the backend flow).
# Frontend reaches the API through the VPS nginx reverse proxy.
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml pull frontend
# ──────────────────────────────────────────────────────────────────────────────

networks:
  default:
    name: openzync_network
    external: true # attach-only; creation owned by the backend flow (core CD preflight); fails fast if the network is missing.

services:
  # ── Next.js frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/openzync/frontend:latest # public on ghcr.io since 2026-08-31 — no pull auth needed
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    restart: unless-stopped
