# ──────────────────────────────────────────────────────────────────────────────
# OpenZync Frontend — CI/CD Pipeline
# ──────────────────────────────────────────────────────────────────────────────
# Stages:
#   changeset-check  → PR gate: require a .changeset fragment (unless trivial)
#   build-and-deploy → Build Docker image, push to ghcr.io, deploy on VPS
#   changeset-version→ Tag helper: no-op if no fragments, documents manual flow
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy Frontend

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'
      - 'deploy/**'
      - '.changeset/**'
      - 'CHANGELOG.md'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ── PR gate: require a changeset unless labelled trivial/skip-changelog ──
  changeset-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bypass check for trivial PRs
        id: bypass
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          echo "labels=$LABELS"
          if echo "$LABELS" | grep -qE '"trivial"|"skip-changelog"'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.bypass.outputs.skip == 'false'
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
        if: steps.bypass.outputs.skip == 'false'

      - name: Check changeset status
        if: steps.bypass.outputs.skip == 'false'
        run: npx changeset status --since=origin/main

      - name: Skipped — trivial / skip-changelog label present
        if: steps.bypass.outputs.skip == 'true'
        run: echo "Skipping changeset check (trivial/skip-changelog)."

  build-and-deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker image
        run: |
            TAG="${GITHUB_SHA}"
            docker build \
              --build-arg NEXT_PUBLIC_API_URL=https://app.openzync.tech \
              -t ghcr.io/openzync/frontend:$TAG \
              -f Dockerfile .
            docker tag ghcr.io/openzync/frontend:$TAG ghcr.io/openzync/frontend:latest
            docker push --all-tags ghcr.io/openzync/frontend

      - name: Upload deployment files to VPS
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER }}"
          TARGET="/home/deploy/openzync"

          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${USER}@${HOST}" "mkdir -p ${TARGET}"

          tar czf /tmp/deploy-files.tar.gz \
            deploy/docker-compose.yml

          scp -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            /tmp/deploy-files.tar.gz \
            "${USER}@${HOST}:${TARGET}/"

      - name: Extract and deploy frontend container
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_PAT
          script: |
            cd /home/deploy/openzync
            tar xzf deploy-files.tar.gz
            rm deploy-files.tar.gz

            # ── Authenticate to ghcr.io ────────────────────────────
            echo "$GHCR_PAT" | docker login ghcr.io -u rohnsha0 --password-stdin

            # ── Write NEXT_PUBLIC_API_URL into deploy/.env ──────────────
            # docker-compose.yml resolves env_file relative to its own
            # directory (deploy/), not the working directory.
            echo 'NEXT_PUBLIC_API_URL=https://app.openzync.tech' > deploy/.env

            # ── Pull latest image and restart ──────────────────────
            docker compose -f deploy/docker-compose.yml pull frontend
            docker compose -f deploy/docker-compose.yml up -d frontend

  # ── Tag helper: on v* tags, verify fragments were consumed (no-op ponytail) ──
  changeset-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Verify tag matches package version / show remaining fragments
        run: |
          echo "Tag: $GITHUB_REF"
          echo "package.json version: $(node -p "require('./package.json').version")"
          echo "Remaining fragments:"
          ls -1 .changeset/*.md 2>/dev/null | grep -v README || echo "(none — CHANGELOG already consumed)"
          # If fragments still exist, the release was cut without `npx changeset version`.
          # Ponytail: do NOT run `changeset version` in CI — run it locally on main,
          # commit CHANGELOG + version bump, then tag:
          #   npx changeset version && git add -A && git commit -m "chore: version packages"
          npx changeset status --since=origin/main || true
